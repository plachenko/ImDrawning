# fly.toml app configuration file generated for imdrawning on 2026-07-31T18:15:01Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'imdrawning'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[processes]
  app = 'node scripts/collab-server.mjs'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
